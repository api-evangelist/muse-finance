aid: muse-finance
name: Muse Finance
description: >-
  Muse Finance is a UK embedded-finance platform (Muse Finance Limited, London &
  Hastings) providing modular working-capital infrastructure — invoice finance,
  trade finance and supply finance — that lenders, originators, foreign-exchange
  providers and payment platforms integrate as a white-label product or via a
  REST API. The Muse Finance API lets partners submit and convert leads, manage
  finance applications and agreements, raise funds requests, submit exchange
  rates, and handle credit-backed offers, with JWT + API-key authentication and
  webhook or polling event notifications. Backed by Techstars.
